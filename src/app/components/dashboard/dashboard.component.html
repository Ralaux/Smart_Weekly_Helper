<div class="min-h-screen bg-gray-50 p-6">

    <div *ngIf="isDemo"
        class="bg-amber-100 border border-amber-300 text-amber-800 px-4 py-3 rounded mb-6 text-center font-bold">
        MODE DÉMONSTRATION - Données Fictives
    </div>

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">Tableau de Bord</h1>
        <div class="flex gap-4">
            <button (click)="downloadExcel()"
                class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow flex items-center gap-2">
                Télécharger les données brutes
            </button>
            <button (click)="goBack()"
                class="bg-white border hover:bg-gray-100 text-gray-700 font-semibold py-2 px-4 rounded shadow">
                &larr; Retour
            </button>
        </div>
    </div>

    <!-- Commerce -->
    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <div id="chart1"></div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow mb-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2">
            <div id="chart2"></div>
        </div>
        <div class="lg:col-span-1">
            <h3 class="text-center font-bold mb-4 text-slate-700">Ratios de Signature</h3>
            <table class="w-full text-sm">
                <thead class="bg-gray-100 font-bold">
                    <tr>
                        <th class="p-2">KPI</th>
                        <th class="p-2 bg-gray-200">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of data.ratios" class="border-b">
                        <td class="p-2">{{row.name}}</td>
                        <td class="p-2 font-bold">{{ row.total*100 | number:'1.0-0' }}%</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Analyse -->
    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <div id="chart3"></div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <div id="chart4"></div>
    </div>

    <!-- Categories -->
    <div class="grid grid-cols-1 gap-8">
        <div class="bg-white p-6 rounded-lg shadow">
            <div id="chart5"></div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div id="chart6"></div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div id="chart7"></div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div id="chart8"></div>
        </div>
    </div>

</div>
